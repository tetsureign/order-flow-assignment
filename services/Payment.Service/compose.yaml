services:
  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5434:5432"

  payment-service:
    build:
      context: ../..
      dockerfile: services/Payment.Service/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=payment-db;Database=payment_db;Username=payment_user;Password=secretpassword"
      Pulsar__ServiceUrl: "pulsar://pulsar:6650"
      ASPNETCORE_HTTP_PORTS: "5003"
    depends_on:
      - payment-db
